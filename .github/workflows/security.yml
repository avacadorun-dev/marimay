name: Source security

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        description: Exact validated candidate commit for reusable release scans
        required: true
        type: string

permissions:
  contents: read

jobs:
  secrets:
    name: Git history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete public history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan submitted history rather than GitHub's temporary PR merge metadata.
          ref: ${{ inputs.source-ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        env:
          # Gitleaks v8.30.1 Linux x64, GitHub release asset 378332058.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/marimay-gitleaks"
          cd "$RUNNER_TEMP/marimay-gitleaks"
          curl --fail --silent --show-error --location --proto '=https' \
            --retry 5 --retry-delay 2 --retry-max-time 180 \
            --connect-timeout 15 --max-time 60 \
            --header 'Accept: application/octet-stream' \
            https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058 \
            --output gitleaks.tar.gz
          printf '%s  gitleaks.tar.gz\n' "$GITLEAKS_SHA256" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan every reachable public commit
        run: >-
          "$RUNNER_TEMP/marimay-gitleaks/gitleaks" git
          --config .gitleaks.toml --log-opts="--all" --redact=100
          --max-archive-depth=3 --no-banner .
      - name: Check historical private infrastructure markers
        run: ./tools/check-publication --history
