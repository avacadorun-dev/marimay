name: Experimental macOS alpha

on:
  push:
    tags: ['v0.*-alpha.*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing alpha tag on main to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alpha-${{ github.event.pull_request.number || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate alpha identity and repository gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - name: Check out exact candidate and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, tag and main ancestry
        id: identity
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tools/release/prepare.py
      - name: Check repository contracts
        run: |
          ./tools/check-architecture
          ./tools/check-roadmap
          ./tools/check-generated
          ./tools/check-spec-terms
          ./tools/check-example-syntax
          ./tools/check-syntax-coverage
          ./tools/check-c-memory-policy
          ./tools/check-release-contract
          ./tools/check-doc-links
          ./tools/check-publication
      - name: Test release validation and package failures
        run: |
          python3 -m unittest discover -s tools/release -p 'test_*.py'
          python3 -m unittest discover -s tools -p 'test_package_macos.py'
          python3 -m unittest discover -s tools/publication -p 'test_*.py'

  security:
    name: Complete source security
    needs: prepare
    uses: ./.github/workflows/security.yml
    with:
      source-ref: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read

  build:
    name: Installable macOS ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Configure portable macOS distribution
        run: >-
          cmake -S . -B build/alpha -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=/usr/bin/clang -DMMAY_WARNINGS_AS_ERRORS=ON
          -DMMAY_PORTABLE_MACOS_TOOLCHAIN=ON
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_OSX_ARCHITECTURES="$RELEASE_ARCH"
      - name: Build compiler and both runtimes
        run: cmake --build build/alpha --parallel 4
      - name: Run complete portable distribution suite
        run: ctest --test-dir build/alpha --parallel 4 --output-on-failure
      - name: Build distribution archives
        run: cmake --build build/alpha --target mmay_package
      - name: Stage complete installation and build package
        run: |
          cmake --install build/alpha --prefix "$RUNNER_TEMP/alpha-prefix"
          python3 tools/package-macos --install-root "$RUNNER_TEMP/alpha-prefix" \
            --output-dir build/alpha/distribution --version "$RELEASE_VERSION" --arch "$RELEASE_ARCH"
      - name: Verify real Installer, global command and relocated archive
        run: >-
          python3 tools/test-macos-install
          --package "build/alpha/distribution/marimay-$RELEASE_VERSION-darwin-$RELEASE_ARCH.pkg"
          --archive "build/alpha/distribution/marimay-$RELEASE_VERSION-darwin-$RELEASE_ARCH.tar.gz"
          --version "$RELEASE_VERSION" --arch "$RELEASE_ARCH"
          --work "$RUNNER_TEMP/alpha-installed-smoke" --allow-system-install
          --evidence-output "build/alpha/distribution/macos-verification-$RELEASE_ARCH.json"
      - name: Preserve validated release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpha-darwin-${{ matrix.arch }}
          path: |
            build/alpha/distribution/*.tar.gz
            build/alpha/distribution/*.pkg
            build/alpha/distribution/*.sha256
            build/alpha/distribution/*.json
          if-no-files-found: error
          retention-days: 7

  verified-ci:
    name: Require complete exact-commit C17 matrix
    needs: [prepare, security, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Verify complete C17 result and current release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: >-
          python3 tools/release/verify_ci.py --repository "$GITHUB_REPOSITORY"
          --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" --wait-seconds 3600

  publish:
    name: Publish verified experimental prerelease
    needs: [prepare, security, build, verified-ci]
    if: github.event_name != 'pull_request' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-alpha-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Download artifacts from this workflow only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name alpha-darwin-arm64 --dir release-assets/arm64
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name alpha-darwin-x86_64 --dir release-assets/x86_64
      - name: Verify assets, upload draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          python3 tools/release/publish.py --repository "$GITHUB_REPOSITORY"
          --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" --version "$RELEASE_VERSION"
          --assets release-assets --notes "docs/releases/$RELEASE_VERSION.md"
