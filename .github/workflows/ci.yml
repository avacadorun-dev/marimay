name: C17 bootstrap

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation invariants
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check generated artifacts
        run: ./tools/check-generated
      - name: Check roadmap and checkpoint invariants
        run: ./tools/check-roadmap
      - name: Check documentation links
        run: ./tools/check-doc-links
      - name: Check specification terms
        run: ./tools/check-spec-terms
      - name: Check example syntax
        run: ./tools/check-example-syntax
      - name: Check syntax coverage manifest
        run: ./tools/check-syntax-coverage
      - name: Check production C memory policy
        run: ./tools/check-c-memory-policy
      - name: Check architecture boundaries
        run: ./tools/check-architecture

  c17:
    name: ${{ matrix.target.name }} / ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Linux x86_64 GCC
            runner: ubuntu-24.04
            compiler: gcc
          - name: Linux x86_64 Clang
            runner: ubuntu-24.04
            compiler: clang
          - name: Linux arm64 GCC
            runner: ubuntu-24.04-arm
            compiler: gcc
          - name: macOS arm64 AppleClang
            runner: macos-15
            compiler: clang
          - name: macOS x86_64 AppleClang
            runner: macos-15-intel
            compiler: clang
          - name: Windows x86_64 MSVC
            runner: windows-2025
            compiler: ""
        configuration: [Debug, Release]
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DCMAKE_C_COMPILER=${{ matrix.target.compiler }}
          -DMMAY_WARNINGS_AS_ERRORS=ON
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DMMAY_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --parallel 4 --output-on-failure
      - name: Preserve CP39 host artifacts
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: cp39-${{ matrix.target.name }}
          path: |
            build/distribution/*.tar.gz
            build/distribution/*.zip
            build/distribution/*.sha256
          if-no-files-found: error

  unix-sanitizers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 ASan+UBSan
            runner: ubuntu-24.04
            compiler: clang
          - name: Linux arm64 ASan+UBSan
            runner: ubuntu-24.04-arm
            compiler: clang
          - name: macOS arm64 ASan+UBSan
            runner: macos-15
            compiler: clang
    runs-on: ${{ matrix.runner }}
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake --preset asan-ubsan
      - name: Build
        run: cmake --build --preset asan-ubsan --parallel
      - name: Test
        run: ctest --preset asan-ubsan

  linux-tsan:
    name: Linux x86_64 TSan
    runs-on: ubuntu-24.04
    env:
      CC: clang
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset tsan
      - name: Build
        run: cmake --build --preset tsan --parallel
      - name: Test
        run: ctest --preset tsan

  linux-leaks:
    name: Linux x86_64 LeakSanitizer
    runs-on: ubuntu-24.04
    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset asan-ubsan
      - name: Build
        run: cmake --build --preset asan-ubsan --parallel
      - name: Test
        run: ctest --preset asan-ubsan --output-on-failure

  windows-asan:
    name: Windows x86_64 MSVC ASan
    runs-on: windows-2025
    env:
      ASAN_OPTIONS: halt_on_error=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan --parallel
      - name: Test
        run: ctest --preset asan

  fuzz-build:
    name: Linux x86_64 fuzz / build once
    runs-on: ubuntu-24.04
    env:
      CC: clang
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset fuzz
      - name: Build all fuzz targets
        run: >-
          cmake --build build/fuzz
          --target mmay_fuzz_bytecode mmay_fuzz_frontend
          mmay_fuzz_formatter mmay_fuzz_json
          --parallel
      - name: Bundle fuzz executables
        run: >-
          tar -czf fuzz-binaries.tar.gz
          -C build/fuzz/tests/fuzz
          mmay_fuzz_bytecode mmay_fuzz_frontend
          mmay_fuzz_formatter mmay_fuzz_json
      - name: Preserve fuzz executables
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-linux-x86_64-binaries
          path: fuzz-binaries.tar.gz
          if-no-files-found: error
          retention-days: 1

  fuzz:
    name: Linux x86_64 fuzz / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    needs: fuzz-build
    strategy:
      fail-fast: false
      matrix:
        target: [bytecode, frontend, formatter, json]
    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:quarantine_size_mb=64
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore fuzz executables
        uses: actions/download-artifact@v4
        with:
          name: fuzz-linux-x86_64-binaries
      - name: Extract fuzz executables
        run: |
          mkdir -p build/fuzz/tests/fuzz
          tar -xzf fuzz-binaries.tar.gz -C build/fuzz/tests/fuzz
      - name: Run sustained campaign
        run: >-
          ./build/fuzz/tests/fuzz/mmay_fuzz_${{ matrix.target }}
          -max_total_time=600
          -timeout=10
          -print_final_stats=1
          tests/fuzz/corpus/${{ matrix.target }}
      - name: Preserve fuzz failure inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-failure-inputs
          path: |
            crash-*
            timeout-*
            oom-*
            leak-*
          if-no-files-found: ignore
