name: Gitea C17 bootstrap

on:
  push:
  pull_request:

jobs:
  documentation:
    name: Documentation and architecture invariants
    runs-on: ubuntu-latest
    container:
      image: docker.gitea.com/runner-images:ubuntu-latest@sha256:fd911d7417bfbf0f454530e447da95b58001e1df41bbc5e1a8dd35d432575aae
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install documentation dependencies
        run: ./tools/ci-apt-install python3
      - name: Check generated artifacts
        run: ./tools/check-generated
      - name: Check roadmap and checkpoint invariants
        run: ./tools/check-roadmap
      - name: Check documentation links
        run: ./tools/check-doc-links
      - name: Check specification terms
        run: ./tools/check-spec-terms
      - name: Check example syntax
        run: ./tools/check-example-syntax
      - name: Check syntax coverage manifest
        run: ./tools/check-syntax-coverage
      - name: Check production C memory policy
        run: ./tools/check-c-memory-policy
      - name: Check architecture boundaries
        run: ./tools/check-architecture

  c17:
    name: Linux x86_64 ${{ matrix.compiler }} / ${{ matrix.configuration }}
    runs-on: ubuntu-latest
    container:
      image: docker.gitea.com/runner-images:ubuntu-latest@sha256:fd911d7417bfbf0f454530e447da95b58001e1df41bbc5e1a8dd35d432575aae
    needs: documentation
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        configuration: [Debug, Release]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install GCC C17 toolchain
        if: ${{ matrix.compiler == 'gcc' }}
        run: >-
          ./tools/ci-apt-install
          --command ar --command cmake --command gcc
          --command make --command python3 --
          build-essential cmake python3
      - name: Install Clang C17 toolchain
        if: ${{ matrix.compiler == 'clang' }}
        run: >-
          ./tools/ci-apt-install
          --command ar --command clang --command cmake
          --command make --command python3 --
          build-essential clang cmake python3
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DMMAY_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: >-
          ctest --test-dir build
          -C ${{ matrix.configuration }}
          --parallel 4 --output-on-failure
      - name: Preserve CP39 Linux x86_64 artifacts
        if: ${{ matrix.compiler == 'gcc' && matrix.configuration == 'Release' }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: cp39-linux-x86_64
          path: |
            build/distribution/*.tar.gz
            build/distribution/*.sha256
          if-no-files-found: error

  sanitizers:
    name: Linux x86_64 ASan+UBSan+LSan
    runs-on: ubuntu-latest
    container:
      image: docker.gitea.com/runner-images:ubuntu-latest@sha256:fd911d7417bfbf0f454530e447da95b58001e1df41bbc5e1a8dd35d432575aae
    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:symbolize=1:allow_addr2line=1
      ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install C17 toolchain
        run: >-
          ./tools/ci-apt-install
          build-essential clang cmake libclang-rt-18-dev llvm-18 python3
      - name: Configure
        run: cmake --preset asan-ubsan
      - name: Build
        run: cmake --build --preset asan-ubsan --parallel
      - name: Test
        run: |
          test_jobs=$(nproc)
          if [ "${test_jobs}" -gt 8 ]; then test_jobs=8; fi
          ctest --preset asan-ubsan --parallel "${test_jobs}" --output-on-failure

  fuzz-build:
    name: Linux x86_64 fuzz / build once
    runs-on: ubuntu-latest
    container:
      image: docker.gitea.com/runner-images:ubuntu-latest@sha256:fd911d7417bfbf0f454530e447da95b58001e1df41bbc5e1a8dd35d432575aae
    env:
      CC: clang
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install fuzz toolchain
        run: >-
          ./tools/ci-apt-install
          build-essential clang cmake libclang-rt-18-dev llvm-18 python3
      - name: Configure
        run: cmake --preset fuzz
      - name: Build all fuzz targets
        run: >-
          cmake --build build/fuzz
          --target mmay_fuzz_bytecode mmay_fuzz_frontend
          mmay_fuzz_formatter mmay_fuzz_json
          --parallel
      - name: Bundle fuzz executables
        run: >-
          tar -czf fuzz-binaries.tar.gz
          -C build/fuzz/tests/fuzz
          mmay_fuzz_bytecode mmay_fuzz_frontend
          mmay_fuzz_formatter mmay_fuzz_json
      - name: Preserve fuzz executables
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: fuzz-linux-x86_64-binaries
          path: fuzz-binaries.tar.gz
          if-no-files-found: error

  fuzz:
    name: Linux x86_64 fuzz / ${{ matrix.target }}
    runs-on: ubuntu-latest
    container:
      image: docker.gitea.com/runner-images:ubuntu-latest@sha256:fd911d7417bfbf0f454530e447da95b58001e1df41bbc5e1a8dd35d432575aae
    needs: fuzz-build
    strategy:
      fail-fast: false
      matrix:
        target: [bytecode, frontend, formatter, json]
    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:symbolize=1:allow_addr2line=1:quarantine_size_mb=64
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install sanitizer runtime
        run: ./tools/ci-apt-install libclang-rt-18-dev llvm-18
      - name: Restore fuzz executables
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: fuzz-linux-x86_64-binaries
      - name: Extract fuzz executables
        run: |
          mkdir -p build/fuzz/tests/fuzz
          tar -xzf fuzz-binaries.tar.gz -C build/fuzz/tests/fuzz
      - name: Run sustained campaign
        run: >-
          ./build/fuzz/tests/fuzz/mmay_fuzz_${{ matrix.target }}
          -max_total_time=600
          -timeout=10
          -print_final_stats=1
          tests/fuzz/corpus/${{ matrix.target }}
      - name: Preserve fuzz failure inputs
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: fuzz-${{ matrix.target }}-failure-inputs
          path: |
            crash-*
            timeout-*
            oom-*
            leak-*
          if-no-files-found: ignore
  thread-sanitizer:
    name: Linux x86_64 TSan
    runs-on: ubuntu-latest
    container:
      image: docker.gitea.com/runner-images:ubuntu-latest@sha256:fd911d7417bfbf0f454530e447da95b58001e1df41bbc5e1a8dd35d432575aae
    needs: sanitizers
    env:
      CC: clang
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install C17 toolchain
        run: >-
          ./tools/ci-apt-install
          build-essential clang cmake libclang-rt-18-dev python3
      - name: Configure
        run: cmake --preset tsan
      - name: Build
        run: cmake --build --preset tsan --parallel
      - name: Test
        run: |
          test_jobs=$(nproc)
          if [ "${test_jobs}" -gt 8 ]; then test_jobs=8; fi
          ctest --preset tsan --parallel "${test_jobs}" --output-on-failure
